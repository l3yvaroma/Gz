<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icono.svg">
<title>Visor de líneas (cámara)</title>
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #000; touch-action: none;
    user-select: none; -webkit-user-select: none;
    font-family: system-ui, sans-serif;
  }
  #video {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
  }
  #lienzo {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    touch-action: none;
  }
  #controles {
    position: fixed; bottom: 12px; left: 0; right: 0;
    display: flex; justify-content: center; gap: 8px;
    z-index: 10;
  }
  button {
    padding: 10px 14px; border: 0; border-radius: 6px;
    background: rgba(43,43,43,.85); color: #eee; font-size: 14px;
  }
  #aviso {
    position: fixed; top: 12px; left: 0; right: 0;
    text-align: center; color: #fff;
    background: rgba(0,0,0,.6); padding: 8px;
    font-size: 14px; z-index: 20; pointer-events: none;
  }
</style>
</head>
<body>
<video id="video" autoplay playsinline muted></video>
<canvas id="lienzo"></canvas>
<div id="aviso">Permite el acceso a la cámara cuando lo pida</div>
<div id="controles">
  <button id="menos">− Ángulo</button>
  <button id="mas">+ Ángulo</button>
  <button id="color">Color</button>
  <button id="camara">Cambiar cámara</button>
</div>
<script>
const video = document.getElementById('video');
const canvas = document.getElementById('lienzo');
const ctx = canvas.getContext('2d');
const aviso = document.getElementById('aviso');

const colores = ['#00ffff', '#ff00ff', '#ffff00', '#00ff00', '#ffffff'];
let iColor = 0;
let color = colores[0];
let angulo = 0;
let origen = { x: 0, y: 0 };
let arrastrando = false;
let camaraTrasera = true;
let stream = null;
let ancho = 0, alto = 0;

async function iniciarCamara() {
  if (stream) stream.getTracks().forEach(pista => pista.stop());
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: camaraTrasera ? 'environment' : 'user',
        width: { ideal: 1920 },
        height: { ideal: 1080 }
      },
      audio: false
    });
    video.srcObject = stream;
    aviso.textContent = '';
  } catch (error) {
    aviso.textContent = 'No se pudo abrir la cámara: ' + error.message;
  }
}

function ajustar() {
  const dpr = window.devicePixelRatio || 1;
  ancho = window.innerWidth;
  alto = window.innerHeight;
  canvas.width = ancho * dpr;
  canvas.height = alto * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (!origen.x && !origen.y) {
    origen = { x: ancho / 2, y: alto / 2 };
  }
  dibujar();
}

function dibujar() {
  ctx.clearRect(0, 0, ancho, alto);
  const rad = angulo * Math.PI / 180;
  const largo = Math.max(ancho, alto);

  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  ctx.shadowColor = 'rgba(0,0,0,.8)';
  ctx.shadowBlur = 4;

  ctx.beginPath();
  ctx.moveTo(origen.x - Math.cos(rad) * largo, origen.y - Math.sin(rad) * largo);
  ctx.lineTo(origen.x + Math.cos(rad) * largo, origen.y + Math.sin(rad) * largo);
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(origen.x, origen.y, 24, 0, Math.PI * 2);
  ctx.stroke();
}

function mover(e) {
  origen.x = e.clientX;
  origen.y = e.clientY;
  dibujar();
}

canvas.addEventListener('pointerdown', e => { arrastrando = true; mover(e); });
window.addEventListener('pointermove', e => { if (arrastrando) mover(e); });
window.addEventListener('pointerup', () => { arrastrando = false; });

document.getElementById('mas').addEventListener('click', () => { angulo += 1; dibujar(); });
document.getElementById('menos').addEventListener('click', () => { angulo -= 1; dibujar(); });
document.getElementById('color').addEventListener('click', () => {
  iColor = (iColor + 1) % colores.length;
  color = colores[iColor];
  dibujar();
});
document.getElementById('camara').addEventListener('click', () => {
  camaraTrasera = !camaraTrasera;
  iniciarCamara();
});

window.addEventListener('resize', ajustar);
ajustar();
iniciarCamara();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>
</body>
</html>
