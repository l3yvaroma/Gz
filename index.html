<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icono.svg">
<title>Visor de líneas</title>
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #111; touch-action: none;
    user-select: none; -webkit-user-select: none;
    font-family: system-ui, sans-serif;
  }
  #lienzo { display: block; touch-action: none; }
  #controles {
    position: fixed; bottom: 12px; left: 0; right: 0;
    display: flex; justify-content: center; gap: 8px;
  }
  button {
    padding: 10px 14px; border: 0; border-radius: 6px;
    background: #2b2b2b; color: #eee; font-size: 14px;
  }
</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<div id="controles">
  <button id="menos">− Ángulo</button>
  <button id="mas">+ Ángulo</button>
  <button id="color">Color</button>
  <button id="centro">Centro</button>
</div>
<script>
const canvas = document.getElementById('lienzo');
const ctx = canvas.getContext('2d');

const colores = ['#00ffff', '#ff00ff', '#ffff00', '#00ff00', '#ffffff'];
let iColor = 0;
let color = colores[0];
let angulo = 0;
let origen = { x: 0, y: 0 };
let arrastrando = false;

function ajustar() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  if (!origen.x && !origen.y) {
    origen = { x: canvas.width / 2, y: canvas.height / 2 };
  }
  dibujar();
}

function dibujar() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const rad = angulo * Math.PI / 180;
  const largo = Math.max(canvas.width, canvas.height);
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(origen.x - Math.cos(rad) * largo, origen.y - Math.sin(rad) * largo);
  ctx.lineTo(origen.x + Math.cos(rad) * largo, origen.y + Math.sin(rad) * largo);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(origen.x, origen.y, 24, 0, Math.PI * 2);
  ctx.stroke();
}

function mover(e) {
  origen.x = e.clientX;
  origen.y = e.clientY;
  dibujar();
}

canvas.addEventListener('pointerdown', e => { arrastrando = true; mover(e); });
window.addEventListener('pointermove', e => { if (arrastrando) mover(e); });
window.addEventListener('pointerup', () => { arrastrando = false; });

document.getElementById('mas').addEventListener('click', () => { angulo += 1; dibujar(); });
document.getElementById('menos').addEventListener('click', () => { angulo -= 1; dibujar(); });
document.getElementById('color').addEventListener('click', () => {
  iColor = (iColor + 1) % colores.length;
  color = colores[iColor];
  dibujar();
});
document.getElementById('centro').addEventListener('click', () => {
  origen = { x: canvas.width / 2, y: canvas.height / 2 };
  angulo = 0;
  dibujar();
});

window.addEventListener('resize', ajustar);
ajustar();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>
</body>
</html>
