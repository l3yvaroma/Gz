<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icono.svg">
<title>Visor de líneas (cámara)</title>
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #000; touch-action: none;
    user-select: none; -webkit-user-select: none;
    font-family: system-ui, sans-serif;
  }
  #video {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
  }
  #lienzo {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    touch-action: none;
  }
  #controles {
    position: fixed; bottom: 12px; left: 0; right: 0;
    display: flex; justify-content: center; gap: 8px;
    flex-wrap: wrap; padding: 0 8px;
    z-index: 10;
  }
  button {
    padding: 10px 14px; border: 0; border-radius: 6px;
    background: rgba(43,43,43,.85); color: #eee; font-size: 14px;
  }
  #aviso {
    position: fixed; top: 12px; left: 0; right: 0;
    text-align: center; color: #fff;
    background: rgba(0,0,0,.6); padding: 8px;
    font-size: 14px; z-index: 20; pointer-events: none;
  }
</style>
</head>
<body>
<video id="video" autoplay playsinline muted></video>
<canvas id="lienzo"></canvas>
<div id="aviso">Permite el acceso a la cámara cuando lo pida</div>
<div id="controles">
  <button id="color">Color</button>
  <button id="camara">Cambiar cámara</button>
</div>
<script>
const video = document.getElementById('video');
const canvas = document.getElementById('lienzo');
const ctx = canvas.getContext('2d');
const aviso = document.getElementById('aviso');

const colores = ['#00ffff', '#ff00ff', '#ffff00', '#00ff00', '#ffffff'];
let iColor = 0;
let color = colores[0];
let angulo = 0;
let origen = { x: 0, y: 0 };
let inicializado = false;
let arrastrando = false;
let camaraTrasera = true;
let stream = null;
let ancho = 0, alto = 0;

async function iniciarCamara() {
  if (stream) stream.getTracks().forEach(pista => pista.stop());
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: camaraTrasera ? 'environment' : 'user',
        width: { ideal: 1920 },
        height: { ideal: 1080 }
      },
      audio: false
    });
    video.srcObject = stream;
    aviso.textContent = '';
  } catch (error) {
    aviso.textContent = 'No se pudo abrir la cámara: ' + error.message;
  }
}

function ajustar() {
  const dpr = window.devicePixelRatio || 1;
  ancho = window.innerWidth;
  alto = window.innerHeight;
  canvas.width = ancho * dpr;
  canvas.height = alto * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (!inicializado) {
    origen = { x: ancho / 2, y: alto / 2 };
    inicializado = true;
  }
  dibujar();
}

// Dibuja la flecha estilo cursor de Windows con la punta en (x, y),
// apuntando en la direccion de anguloGrados.
function dibujarFlechaWindows(x, y, anguloGrados, escala) {
  const puntos = [
    [0, 0], [0, 16], [4.6, 12.7], [7.3, 18.7],
    [9.7, 17.6], [6.9, 11.8], [12.5, 11.8]
  ];

  // La punta esta en puntos[0]. Calculamos hacia donde apunta naturalmente
  // usando la bisectriz de las dos aristas que salen de la punta, y la invertimos.
  const a1 = Math.atan2(puntos[1][1] - puntos[0][1], puntos[1][0] - puntos[0][0]);
  const ult = puntos[puntos.length - 1];
  const a2 = Math.atan2(ult[1] - puntos[0][1], ult[0] - puntos[0][0]);
  const haciaCuerpo = (a1 + a2) / 2;
  const anguloNatural = haciaCuerpo + Math.PI;

  const rad = anguloGrados * Math.PI / 180;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rad - anguloNatural);
  ctx.scale(escala, escala);
  ctx.beginPath();
  ctx.moveTo(puntos[0][0], puntos[0][1]);
  for (let i = 1; i < puntos.length; i++) {
    ctx.lineTo(puntos[i][0], puntos[i][1]);
  }
  ctx.closePath();
  ctx.fillStyle = '#ffffff';
  ctx.strokeStyle = '#000000';
  ctx.lineWidth = 1.2;
  ctx.shadowColor = 'rgba(0,0,0,.8)';
  ctx.shadowBlur = 4;
  ctx.fill();
  ctx.stroke();
  ctx.restore();
}

function dibujar() {
  ctx.clearRect(0, 0, ancho, alto);
  const rad = angulo * Math.PI / 180;
  const largo = Math.max(ancho, alto);

  ctx.lineWidth = 2;
  ctx.shadowColor = 'rgba(0,0,0,.8)';
  ctx.shadowBlur = 4;

  // Linea principal que pasa por el centro
  ctx.strokeStyle = color;
  ctx.beginPath();
  ctx.moveTo(origen.x - Math.cos(rad) * largo, origen.y - Math.sin(rad) * largo);
  ctx.lineTo(origen.x + Math.cos(rad) * largo, origen.y + Math.sin(rad) * largo);
  ctx.stroke();

  // Flecha de Windows en el centro, apuntando en el sentido de la linea
  dibujarFlechaWindows(origen.x, origen.y, angulo, 2.2);
}

function actualizarAngulo(clientX, clientY) {
  const dx = clientX - origen.x;
  const dy = clientY - origen.y;
  const dist = Math.hypot(dx, dy);
  if (dist < 10) return; // zona muerta cerca del centro para evitar saltos
  angulo = Math.atan2(dy, dx) * 180 / Math.PI;
  dibujar();
}

canvas.addEventListener('pointerdown', e => {
  arrastrando = true;
  actualizarAngulo(e.clientX, e.clientY);
});
window.addEventListener('pointermove', e => {
  if (arrastrando) actualizarAngulo(e.clientX, e.clientY);
});
window.addEventListener('pointerup', () => { arrastrando = false; });
window.addEventListener('pointercancel', () => { arrastrando = false; });

document.getElementById('color').addEventListener('click', () => {
  iColor = (iColor + 1) % colores.length;
  color = colores[iColor];
  dibujar();
});
document.getElementById('camara').addEventListener('click', () => {
  camaraTrasera = !camaraTrasera;
  iniciarCamara();
});

window.addEventListener('resize', ajustar);
ajustar();
iniciarCamara();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>
</body>
</html>
